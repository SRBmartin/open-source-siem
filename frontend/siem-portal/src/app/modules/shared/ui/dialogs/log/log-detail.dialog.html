<!-- src/app/modules/logging/features/logs/log-detail.dialog.html -->
<div class="dlg">
  <div class="hdr">
    <div class="badge">🧾</div>
    <div class="title">Log details</div>
    <div class="meta">
      <span><strong>When:</strong> {{ d.timestamp | date:'yyyy-MM-dd HH:mm:ss' }}</span>
      <span><strong>Severity:</strong> {{ d.severityText || 'n/a' }}</span>
      <span><strong>Topic:</strong> <code>{{ d.siemTopic || 'n/a' }}</code></span>
      <span><strong>ID:</strong> <code>{{ d.id }}</code></span>
    </div>
  </div>

  <div class="msg" *ngIf="d.message">
    <div class="label">Message</div>
    <div class="bubble">{{ d.message }}</div>
  </div>

  <div class="src">
    <div class="label">Source (JSON)</div>
    <pre>{{ pretty() }}</pre>
  </div>

  <div class="actions">
    <button mat-stroked-button cdkCopyToClipboard="{{ pretty() }}">Copy JSON</button>
    <button mat-raised-button class="btn-primary" mat-dialog-close>Close</button>
  </div>
</div>
