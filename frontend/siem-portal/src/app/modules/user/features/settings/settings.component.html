<!-- settings.component.html -->
<section class="settings">
  <header class="hdr">
    <h1>Settings</h1>
    <p class="sub">Update your account preferences</p>
  </header>

  <div class="card">
    <h2 class="sect-title">Change password</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="grid">
      <!-- Current -->
      <mat-form-field appearance="outline" class="full dark-field">
        <mat-label>Current password</mat-label>
        <input matInput [type]="hideCurrent() ? 'password' : 'text'"
               formControlName="currentPassword" autocomplete="current-password">
        <button mat-icon-button matSuffix type="button"
                (click)="hideCurrent.set(!hideCurrent())"
                [attr.aria-label]="'Toggle current password visibility'">
          <mat-icon>{{ hideCurrent() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
      </mat-form-field>

      <!-- New -->
      <mat-form-field appearance="outline" class="dark-field">
        <mat-label>New password</mat-label>
        <input matInput [type]="hideNew() ? 'password' : 'text'"
               formControlName="newPassword" autocomplete="new-password">
        <button mat-icon-button matSuffix type="button"
                (click)="hideNew.set(!hideNew())"
                [attr.aria-label]="'Toggle new password visibility'">
          <mat-icon>{{ hideNew() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
      </mat-form-field>

      <!-- Confirm -->
      <mat-form-field appearance="outline" class="dark-field">
        <mat-label>Confirm new password</mat-label>
        <input matInput [type]="hideConfirm() ? 'password' : 'text'"
               formControlName="confirmPassword" autocomplete="new-password">
        <button mat-icon-button matSuffix type="button"
                (click)="hideConfirm.set(!hideConfirm())"
                [attr.aria-label]="'Toggle confirm password visibility'">
          <mat-icon>{{ hideConfirm() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
      </mat-form-field>

      <div class="actions full">
        <button mat-raised-button class="btn-primary"
                [disabled]="form.invalid || saving()">
          {{ saving() ? 'Saving…' : 'Save password' }}
        </button>
      </div>
    </form>
  </div>
</section>
