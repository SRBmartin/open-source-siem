version: '2.4'

services:
  postgres:
    image: postgres:15
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_pwd
    ports:
      - "5433:5432"
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  platform-pg:
    image: postgres:15
    container_name: platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform_pwd
    ports:
      - "5434:5432"
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - platform_postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.1
    container_name: keycloak-siem
    restart: unless-stopped
    command: >
      start-dev
        --db=postgres
        --hostname-strict=false
        --http-port=8081
    environment:
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_pwd
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: master
      KC_BOOTSTRAP_ADMIN_PASSWORD: master00
    ports:
      - "8081:8081"
    networks:
      - keycloak-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - keycloak_data:/opt/keycloak/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-siem
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@email.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    networks:
      - keycloak-net
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  keycloak-seeder:
    build:
      context: ../backend/Keycloak.Seeder
      dockerfile: Dockerfile
    container_name: keycloak-seeder
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak-net

  mail-service:
    build:
      context: ../backend/Mail.Service
      dockerfile: Dockerfile
    container_name: mail-service
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      ASPNETCORE_URLS: "http://+:8090"
    networks:
      - keycloak-net

  iam-platform:
    build:
      context: ../backend/Iam.Platform
      dockerfile: Dockerfile
    container_name: iam-platform
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "8095:8095"
    environment:
      ASPNETCORE_URLS: "http://+:8095"
    networks:
      - keycloak-net

  siem-platform:
    build:
      context: ../backend/Siem.Platform
      dockerfile: Dockerfile
    container_name: siem-platform
    depends_on:
      iam-platform:
        condition: service_healthy
      mail-service:
        condition: service_healthy
    ports:
      - "8100:8100"
    environment:
      ASPNETCORE_URLS: "http://+:8100"
    networks:
      - keycloak-net

networks:
  keycloak-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  platform_postgres_data:
    driver: local
  keycloak_data:
    driver: local
  pgadmin_data:
    driver: local