version: '2.4'

services:
  postgres:
    image: postgres:15
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_pwd
    ports:
      - "5433:5432"
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  platform-pg:
    image: postgres:15
    container_name: platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform_pwd
    ports:
      - "5434:5432"
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - platform_postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.1
    container_name: keycloak-siem
    restart: unless-stopped
    command: >
      start-dev
        --db=postgres
        --hostname-strict=false
        --http-port=8081
    environment:
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_pwd
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: master
      KC_BOOTSTRAP_ADMIN_PASSWORD: master00
    ports:
      - "8081:8081"
    networks:
      - keycloak-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - keycloak_data:/opt/keycloak/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-siem
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@email.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    networks:
      - keycloak-net
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  keycloak-seeder:
    build:
      context: ../backend/Keycloak.Seeder
      dockerfile: Dockerfile
    container_name: keycloak-seeder
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak-net

  mail-service:
    build:
      context: ../backend/Mail.Service
      dockerfile: Dockerfile
    container_name: mail-service
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      ASPNETCORE_URLS: "http://+:8090"
    networks:
      - keycloak-net

  iam-platform:
    build:
      context: ../backend/Iam.Platform
      dockerfile: Dockerfile
    container_name: iam-platform
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "8095:8095"
    environment:
      ASPNETCORE_URLS: "http://+:8095"
    networks:
      - keycloak-net

  siem-platform:
    build:
      context: ../backend/Siem.Platform
      dockerfile: Dockerfile
    container_name: siem-platform
    depends_on:
      iam-platform:
        condition: service_healthy
      mail-service:
        condition: service_healthy
    ports:
      - "8100:8100"
    environment:
      ASPNETCORE_URLS: "http://+:8100"
    networks:
      - keycloak-net

  kafka-1:
    image: bitnami/kafka:latest
    container_name: kafka-1
    restart: unless-stopped
    networks: [keycloak-net]
    # optional for local host access: "19092:9092"
    # ports: ["19092:9092"]
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_KRAFT_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"   # <-- use same value on all 3 brokers (see note below)
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:9092"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # sensible durability defaults
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_CFG_MIN_INSYNC_REPLICAS: "2"
      KAFKA_CFG_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      # dev-only: allow plaintext inside docker network
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_1_data:/bitnami/kafka

  kafka-2:
    image: bitnami/kafka:latest
    container_name: kafka-2
    restart: unless-stopped
    networks: [keycloak-net]
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_NODE_ID: "2"
      KAFKA_KRAFT_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:9092"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_CFG_MIN_INSYNC_REPLICAS: "2"
      KAFKA_CFG_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_2_data:/bitnami/kafka

  kafka-3:
    image: bitnami/kafka:latest
    container_name: kafka-3
    restart: unless-stopped
    networks: [keycloak-net]
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_NODE_ID: "3"
      KAFKA_KRAFT_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:9092"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_CFG_MIN_INSYNC_REPLICAS: "2"
      KAFKA_CFG_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_3_data:/bitnami/kafka

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    networks: [keycloak-net]
    depends_on: [kafka-1, kafka-2, kafka-3]
    ports: ["8085:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: "siem-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.133.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    networks:
      - keycloak-net
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otelcol-config.yaml:/etc/otelcol/config.yaml:ro

networks:
  keycloak-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  platform_postgres_data:
    driver: local
  keycloak_data:
    driver: local
  pgadmin_data:
    driver: local
  kafka_1_data:
    driver: local
  kafka_2_data:
    driver: local
  kafka_3_data:
    driver: local